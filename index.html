    // Save/Load/Clear
    document.getElementById('btn-save').addEventListener('click',()=>{
      try{
        const layout = {};
        Object.keys(widgets).forEach(id=>{
          const w=widgets[id]; if(!w||!w.el) return;
          layout[id]={ id, type:w.type,
            x:parseInt(w.el.style.left)||0, y:parseInt(w.el.style.top)||0,
            width:parseInt(w.el.style.width)||300, height:parseInt(w.el.style.height)||200,
            minimized:w.el.classList.contains('minimized'),
            zIndex:parseInt(w.el.style.zIndex)||10,
            widgetState:w.getState?w.getState():{} };
        });
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(layout)); }catch(e){}
        const exportData = JSON.stringify({
          version:3, exportedAt:new Date().toISOString(),
          theme: currentTheme || localStorage.getItem(THEME_KEY) || 'dark',
          bg: localStorage.getItem(BG_KEY)||'',
          sparkle: localStorage.getItem(SPARKLE_KEY)||'0',
          sparkleSettings:(()=>{ try{ return JSON.parse(localStorage.getItem(SPARKLE_SETTINGS_KEY)||'{}'); }catch(e){ return {}; } })(),
          layout
        }, null, 2);
        const blob=new Blob([exportData],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download='ClassroomScreen-layout.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        try{ localStorage.setItem(SAVED_KEY, JSON.stringify(layout)); }catch(e){}
      }catch(e){ console.warn('Export failed',e); }
      const btn=document.getElementById('btn-save');
      btn.style.background='rgba(34,197,94,0.2)'; btn.style.borderColor='#22c55e';
      setTimeout(()=>{ btn.style.background=''; btn.style.borderColor=''; },800);
    });
    document.getElementById('btn-load').addEventListener('click',()=>{
      const fileInput=document.createElement('input');
      fileInput.type='file'; fileInput.accept='.json';
      fileInput.addEventListener('change',()=>{
        const file=fileInput.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=(ev)=>{
          try{
            const data=JSON.parse(ev.target.result);
            if(!data.layout&&!data.version){ alert('Invalid layout file. Please use a ClassroomScreen export (.json).'); return; }
            showConfirm('Load layout from file? Current layout will be replaced.',()=>{
              Object.values(widgets).forEach(w=>{ if(w.destroy)w.destroy(); if(w.el)w.el.remove(); });
              widgets={}; try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
              const themeName=data.theme||'dark';
              if(THEMES[themeName]){
                applyTheme(themeName); try{ localStorage.setItem(THEME_KEY,themeName); }catch(e){}
                document.querySelectorAll('.theme-swatch').forEach(sw=>{ sw.style.outline=sw.dataset.theme===themeName?'3px solid #fff':'none'; });
              }
              if(data.bg){ try{ localStorage.setItem(BG_KEY,data.bg); loadBg(); }catch(e){} }
              else{ try{ localStorage.removeItem(BG_KEY); loadBg(); }catch(e){} }
              const sparkleOn=data.sparkle==='1'||data.sparkle===1;
              if(sparkleManager){ sparkleManager.setEnabled(sparkleOn); updateSparkleBtn(); }
              if(data.sparkleSettings){ try{ localStorage.setItem(SPARKLE_SETTINGS_KEY,JSON.stringify(data.sparkleSettings)); }catch(e){} }
              _importing=true;
              const layoutData=data.layout||data;
              Object.values(layoutData).filter(d=>d&&d.type).forEach(d=>{
                try{ addWidget(d.type,d.x,d.y,d.width,d.height,d.id,d.minimized,d.zIndex,d.widgetState); }
                catch(err){ console.warn('Failed to restore widget:',d.type,err); }
              });
              _importing=false;
              saveLayout();
              updateWelcome();
            });
          }catch(err){ console.error('Import error:',err); alert('Invalid layout file. Please use a ClassroomScreen export (.json).'); }
        };
        reader.readAsText(file);
      });
      fileInput.click();
    });
    document.getElementById('btn-clear').addEventListener('click',()=>{
      showConfirm('Clear all widgets? This cannot be undone.',()=>{
        Object.values(widgets).forEach(w=>{if(w.destroy)w.destroy();if(w.el)w.el.remove();});
        widgets={};
        try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
        updateWelcome();
      });
    });

    // Close theme dropdown and settings panels on outside click
    document.addEventListener('click',(e)=>{
      if(!e.target.closest('#theme-dropdown')&&!e.target.closest('#btn-theme')){ themeDropdown.style.display='none'; }
      if(!e.target.closest('.widget-settings')&&!e.target.closest('.wh-btn[title="Settings"]')){ document.querySelectorAll('.widget-settings.open').forEach(s=>s.classList.remove('open')); }
    });

    // ===== INIT =====
    try{ const savedTheme=localStorage.getItem(THEME_KEY); if(savedTheme&&THEMES[savedTheme]) applyTheme(savedTheme); }catch(e){}
    loadBg();
    try{ const savedSparkle=localStorage.getItem(SPARKLE_KEY); if(savedSparkle==='1'){ sparkleManager.setEnabled(true); updateSparkleBtn(); } }catch(e){}
    const hadLayout = loadLayout();
    updateWelcome();
    if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function") lucide.createIcons();

  })();
  </script>

  <div class="cs-watermark">CLASSROOMSCREEN</div>
</body>
</html>
