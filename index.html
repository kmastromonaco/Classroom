      };
    }

    // ===== WIDGET CREATORS =====

    // 1. DATE & TIME (now Time only)
    function createDateTimeWidget(shell, state){
      state = state || { format24:false, tz:'America/Chicago' };
      const body = shell.body;
      body.style.alignItems='center';
      body.style.justifyContent='center';
      body.style.flexDirection='column';
      body.style.gap='0';

      const mainEl = document.createElement('div');
      mainEl.className = 'cs-clock-main';
      mainEl.style.cssText='font-family:"Inter",system-ui,sans-serif;font-weight:900;color:var(--text-primary);text-align:center;line-height:1;letter-spacing:-0.04em;white-space:nowrap;';

      const subEl = document.createElement('div');
      subEl.className = 'cs-clock-sub';
      subEl.style.cssText='font-family:"Inter",system-ui,sans-serif;font-weight:700;color:var(--text-muted);text-align:center;line-height:1;letter-spacing:-0.02em;white-space:nowrap;margin-top:2px;';

      body.appendChild(mainEl);
      body.appendChild(subEl);

      const sett = shell.settings;
      sett.innerHTML = `<div class="widget-settings-title">🕐 Clock Settings</div><div class="settings-row"><label>Format</label><select class="w-select" id="dtfmt-${shell.el.dataset.wid}"><option value="12">12-hour</option><option value="24">24-hour</option></select></div><div class="settings-row"><label>Timezone</label><select class="w-select" id="dttz-${shell.el.dataset.wid}"><option value="America/Chicago">Central (CT)</option><option value="America/New_York">Eastern (ET)</option><option value="America/Denver">Mountain (MT)</option><option value="America/Los_Angeles">Pacific (PT)</option><option value="Europe/London">London (GMT)</option><option value="Europe/Paris">Paris (CET)</option><option value="Asia/Tokyo">Tokyo (JST)</option><option value="Asia/Shanghai">Shanghai (CST)</option><option value="Australia/Sydney">Sydney (AEDT)</option><option value="UTC">UTC</option></select></div>`;
      const fmtSel = sett.querySelector('#dtfmt-'+shell.el.dataset.wid);
      const tzSel  = sett.querySelector('#dttz-'+shell.el.dataset.wid);
      fmtSel.value = state.format24 ? '24' : '12';
      tzSel.value  = state.tz || 'America/Chicago';
      fmtSel.addEventListener('change', ()=>{ state.format24 = fmtSel.value==='24'; sizeFont(); debouncedSave(); });
      tzSel.addEventListener('change',  ()=>{ state.tz = tzSel.value; debouncedSave(); });

      function sizeFont(){
        const w = shell.el.offsetWidth || shell.el.getBoundingClientRect().width || parseInt(shell.el.style.width) || 400;
        const h = shell.el.offsetHeight || shell.el.getBoundingClientRect().height || parseInt(shell.el.style.height) || 170;
        if(!w || w < 10) return;
        const byWidth  = Math.floor(w / 4.6);  // wider divisor for HH:MM:SS
        const byHeight = Math.floor((h - 40) / 1.7);
        const mainPx   = Math.max(28, Math.min(140, Math.min(byWidth, byHeight)));
        const subPx    = Math.round(mainPx * 0.4);
        mainEl.style.setProperty('font-size', mainPx + 'px', 'important');
        subEl.style.setProperty('font-size',  subPx  + 'px', 'important');
      }
      function sizeFontRetry(){
        sizeFont();
        setTimeout(sizeFont, 50);
        setTimeout(sizeFont, 150);
        setTimeout(sizeFont, 400);
      }

      function tick(){
        const now = new Date();
        const tz   = state.tz || 'America/Chicago';
        const h12  = !state.format24;
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: h12
        }).formatToParts(now);
        const get = (type) => (parts.find(p => p.type === type) || { value: '' }).value;
        // Seconds inline with time — HH:MM:SS, AM/PM smaller below
        mainEl.textContent = get('hour') + ':' + get('minute') + ':' + get('second');
        subEl.textContent  = h12 ? get('dayPeriod') : '';
        subEl.style.marginTop = h12 ? '4px' : '0';
      }

      tick();
      const iv = setInterval(tick, 1000);
      sizeFontRetry();

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, mainEl, 64);
      return {
        getState: () => ({ format24: state.format24, tz: state.tz, bgOpacity: state.bgOpacity, hideHeader: state.hideHeader||false, fontSize: state.fontSize }),
        destroy:  () => clearInterval(iv),
        onResize: (w, h) => { sizeFont(); setTimeout(sizeFont, 80); }
      };
    }

    // 1b. DATE WIDGET
    function createDateWidget(shell, state){
      state = state || { view:'day' };
      const DATE_VIEW_KEY = 'cs_date_view';
      try { state.view = localStorage.getItem(DATE_VIEW_KEY) || state.view || 'day'; } catch(e){}

      const body = shell.body;
      body.style.gap='10px'; body.style.padding='10px 12px';

      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex;flex-direction:column;gap:10px;flex:1;';

      const toggleRow = document.createElement('div');
      toggleRow.style.cssText = 'display:flex;gap:6px;justify-content:center;flex-shrink:0;';

      function updateToggle(){
        toggleRow.querySelectorAll('button').forEach(b => {
          const active = b.dataset.view === state.view;
          b.style.background = active ? 'var(--accent)' : 'transparent';
          b.style.color = active ? '#fff' : 'var(--accent)';
        });
      }

      const VIEW_LABELS = {day:'Day',week:'Week',month:'Month',horizontal:'Horiz'};
      ['day','week','month','horizontal'].forEach(v => {
        const btn = document.createElement('button');
        btn.textContent = VIEW_LABELS[v];
        btn.dataset.view = v;
        btn.style.cssText = 'padding:5px 14px;border-radius:20px;border:1.5px solid var(--accent);cursor:pointer;font-size:14px;font-weight:600;transition:all 0.18s;font-family:inherit;';
        btn.style.background = state.view===v ? 'var(--accent)' : 'transparent';
        btn.style.color = state.view===v ? '#fff' : 'var(--accent)';
        btn.addEventListener('click', () => {
          state.view = v;
          try { localStorage.setItem(DATE_VIEW_KEY, v); } catch(e){}
          renderDateContent();
          updateToggle();
          debouncedSave();
        });
        toggleRow.appendChild(btn);
      });

      const contentArea = document.createElement('div');
      contentArea.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column;';

      function renderDateContent() {
        const now = new Date();
        const yr = now.getFullYear(), mo = now.getMonth(), day = now.getDate(), dow = now.getDay();
        const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const DAYS_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        const ww = shell.el.offsetWidth || parseInt(shell.el.style.width) || 420;
        const wh = shell.el.offsetHeight || parseInt(shell.el.style.height) || 340;

        contentArea.innerHTML = '';

        if (state.view === 'day') {
          const numPx = Math.max(72, Math.min(220, Math.floor(Math.min(ww * 0.58, (wh - 90) * 0.65))));
          const topPx = Math.max(16, Math.min(30, Math.floor(numPx * 0.18)));
          const botPx = Math.max(18, Math.min(34, Math.floor(numPx * 0.22)));
          const d = document.createElement('div');
          d.className = 'cs-date-wrap';
          d.style.cssText = 'text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:4px;padding:12px 8px;';
          const topEl = document.createElement('div');
          topEl.className = 'cs-date-top';
          topEl.textContent = 'Today is ' + DAYS[dow] + ',';
          topEl.style.cssText = 'font-weight:600;color:var(--text-muted);letter-spacing:0.04em;';
          topEl.style.setProperty('font-size', topPx + 'px', 'important');
          const numEl = document.createElement('div');
          numEl.className = 'cs-date-num';
          numEl.textContent = day;
          numEl.style.cssText = 'font-weight:900;color:var(--accent);line-height:0.88;letter-spacing:-0.04em;';
          numEl.style.setProperty('font-size', numPx + 'px', 'important');
          const botEl = document.createElement('div');
          botEl.className = 'cs-date-bot';
          botEl.textContent = MONTHS[mo] + ' ' + yr;
          botEl.style.cssText = 'font-weight:700;color:var(--text-primary);letter-spacing:0.02em;';
          botEl.style.setProperty('font-size', botPx + 'px', 'important');
          d.appendChild(topEl);
          d.appendChild(numEl);
          d.appendChild(botEl);
          contentArea.appendChild(d);

        } else if (state.view === 'week') {
          const startOfWeek = new Date(now);
          const mondayOffset = (dow === 0) ? -6 : 1 - dow;
          startOfWeek.setDate(day + mondayOffset);
          const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate() + 6);
          const fmt = function(d){ return MONTHS_SHORT[d.getMonth()]+' '+d.getDate(); };
          const label = fmt(startOfWeek)+' – '+fmt(endOfWeek)+', '+yr;
          const cellSz = Math.max(28, Math.min(52, Math.floor(ww / 9)));
          const cellFs = Math.max(13, Math.min(22, Math.floor(cellSz * 0.55)));
          const hdFs   = Math.max(13, Math.min(20, Math.floor(ww / 26)));
          const lblFs  = Math.max(14, Math.min(22, Math.floor(ww / 22)));
          let html = '<div style="text-align:center;font-size:'+lblFs+'px;font-weight:700;color:var(--text-muted);margin-bottom:10px;">'+label+'</div>';
          html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">';
          ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(h){
            html += '<div style="font-size:'+hdFs+'px;font-weight:700;color:var(--text-muted);padding-bottom:6px;">'+h+'</div>';
          });
          for (var i = 0; i < 7; i++) {
            var d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i);
            var isToday = d.getDate()===day && d.getMonth()===mo && d.getFullYear()===yr;
            html += '<div style="width:'+cellSz+'px;height:'+cellSz+'px;line-height:'+cellSz+'px;border-radius:50%;margin:0 auto;font-size:'+cellFs+'px;font-weight:'+(isToday?'900':'500')+';background:'+(isToday?'var(--accent)':'transparent')+';color:'+(isToday?'#fff':'var(--text-primary)')+';">'+d.getDate()+'</div>';
          }
          html += '</div>';
          contentArea.innerHTML = html;

        } else if (state.view === 'horizontal') {
          const byW = Math.floor(ww / 22);
          const byH = Math.floor((wh - 20) / 1.8);
          const px  = Math.max(10, Math.min(42, Math.min(byW, byH)));
          const d = document.createElement('div');
          d.style.cssText = 'display:flex;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:center;flex:1;gap:0 6px;padding:8px 12px;text-align:center;overflow:hidden;';
          const prefixEl = document.createElement('span');
          prefixEl.style.cssText = 'font-size:'+px+'px;font-weight:600;color:var(--text-muted);letter-spacing:0.02em;white-space:nowrap;';
          prefixEl.textContent = 'Today is';
          const dayEl = document.createElement('span');
          dayEl.style.cssText = 'font-size:'+px+'px;font-weight:900;color:var(--accent);letter-spacing:0.01em;white-space:nowrap;';
          dayEl.textContent = DAYS[dow] + ',';
          const dateEl = document.createElement('span');
          dateEl.style.cssText = 'font-size:'+px+'px;font-weight:700;color:var(--text-primary);letter-spacing:0.01em;white-space:nowrap;';
          dateEl.textContent = MONTHS[mo] + ' ' + day + ', ' + yr;
          d.append(prefixEl, dayEl, dateEl);
          contentArea.appendChild(d);

        } else {
          var firstDay = new Date(yr, mo, 1).getDay();
          var daysInMonth = new Date(yr, mo + 1, 0).getDate();
          const cellSz = Math.max(24, Math.min(44, Math.floor(ww / 10)));
          const cellFs = Math.max(12, Math.min(20, Math.floor(cellSz * 0.52)));
          const hdFs   = Math.max(11, Math.min(16, Math.floor(ww / 34)));
          const ttlFs  = Math.max(16, Math.min(26, Math.floor(ww / 20)));
          var html = '<div style="text-align:center;font-size:'+ttlFs+'px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">'+MONTHS[mo]+' '+yr+'</div>';
          html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;">';
          DAYS_SHORT.forEach(function(h){ html += '<div style="font-size:'+hdFs+'px;font-weight:700;color:var(--text-muted);padding-bottom:4px;">'+h+'</div>'; });
          for (var i = 0; i < firstDay; i++) html += '<div></div>';
          for (var d = 1; d <= daysInMonth; d++) {
            var isToday = d === day;
            html += '<div style="width:'+cellSz+'px;height:'+cellSz+'px;line-height:'+cellSz+'px;border-radius:50%;margin:0 auto;font-size:'+cellFs+'px;font-weight:'+(isToday?'900':'400')+';background:'+(isToday?'var(--accent)':'transparent')+';color:'+(isToday?'#fff':'var(--text-primary)')+';">'+d+'</div>';
          }
          html += '</div>';
          contentArea.innerHTML = html;
        }
      }

      renderDateContent();
      wrapper.appendChild(contentArea);
      body.appendChild(wrapper);

      var msTillMidnight = function(){ var n=new Date(),m=new Date(n); m.setHours(24,0,0,0); return m-n; };
      var midnightTimer = null;
      var schedMidnight = function(){ midnightTimer = setTimeout(function(){ renderDateContent(); schedMidnight(); }, msTillMidnight()); };
      schedMidnight();

      // Build date settings panel — View buttons + opacity + hide header
      var dsett = shell.settings;
      var dTitle = document.createElement('div');
      dTitle.className = 'widget-settings-title';
      dTitle.textContent = '\uD83D\uDCC5 Date Settings';
      dsett.appendChild(dTitle);
      var dViewLabel = document.createElement('div');
      dViewLabel.style.cssText = 'font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;';
      dViewLabel.textContent = 'View';
      dsett.appendChild(dViewLabel);
      dsett.appendChild(toggleRow);

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, dateEl, 48);
      return { getState:function(){ return {view:state.view, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}; }, destroy:function(){ if(midnightTimer) clearTimeout(midnightTimer); }, onResize:function(w,h){ renderDateContent(); setTimeout(renderDateContent,80); } };
    }

    // 2. COUNTDOWN TIMER
    function createCountdownWidget(shell, state){
      state = state || { totalSec:300, remainSec:300, running:false };
      const body = shell.body;
      body.style.cssText += 'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px;';

      const display = document.createElement('div');
      display.className = 'cs-timer-display';
      display.style.cssText = 'font-family:"Inter",system-ui,sans-serif;font-weight:900;color:var(--text-primary);text-align:center;width:100%;cursor:pointer;user-select:none;';
      display.title = 'Click to edit time';

      // Inline edit row (hidden by default)
      const editRow = document.createElement('div');
      editRow.style.cssText = 'display:none;align-items:center;justify-content:center;gap:4px;width:100%;';
      const inpM = document.createElement('input');
      inpM.type='number'; inpM.min=0; inpM.max=99; inpM.placeholder='MM';
      inpM.style.cssText='width:5.5em;text-align:center;font-size:2em;font-weight:800;background:rgba(255,255,255,0.1);color:var(--text-primary);border:2px solid var(--accent);border-radius:10px;padding:8px 10px;outline:none;';
      const sep = document.createElement('span');
      sep.textContent=':'; sep.style.cssText='font-weight:900;font-size:2.4em;color:var(--text-primary);line-height:1;';
      const inpS = document.createElement('input');
      inpS.type='number'; inpS.min=0; inpS.max=59; inpS.placeholder='SS';
      inpS.style.cssText='width:5.5em;text-align:center;font-size:2em;font-weight:800;background:rgba(255,255,255,0.1);color:var(--text-primary);border:2px solid var(--accent);border-radius:10px;padding:8px 10px;outline:none;';
      editRow.append(inpM, sep, inpS);

      function commitEdit(){
        const m = Math.max(0, parseInt(inpM.value)||0);
        const s = Math.min(59, Math.max(0, parseInt(inpS.value)||0));
        state.totalSec = m*60+s;
        state.remainSec = state.totalSec;
        editRow.style.display='none';
        display.style.display='';
        render();
        debouncedSave();
      }
      function openEdit(){
        if(state.running) return;
        inpM.value = Math.floor(state.remainSec/60);
        inpS.value = String(state.remainSec%60).padStart(2,'0');
        display.style.display='none';
        editRow.style.display='flex';
        inpM.focus(); inpM.select();
      }
      display.addEventListener('click', openEdit);
      [inpM, inpS].forEach(inp => {
        inp.addEventListener('keydown', e => { if(e.key==='Enter') commitEdit(); if(e.key==='Escape'){ editRow.style.display='none'; display.style.display=''; } });
        inp.addEventListener('blur', () => { setTimeout(()=>{ if(!editRow.contains(document.activeElement)) commitEdit(); },120); });
      });

      const label = document.createElement('div');
      label.className = 'timer-label';
      label.style.cssText = 'color:var(--text-muted);text-align:center;letter-spacing:0.04em;';
      const editHint = document.createElement('div');
      editHint.textContent = 'tap time to edit';
      editHint.style.cssText = 'font-size:10px;color:var(--text-muted);opacity:0.5;text-align:center;margin-top:-4px;';

      const controls = document.createElement('div');
      controls.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;';

      const btnStart = document.createElement('button'); btnStart.className='w-btn w-btn-primary timer-btn'; btnStart.textContent='▶ Start';
      const btnPause = document.createElement('button'); btnPause.className='w-btn w-btn-secondary timer-btn'; btnPause.textContent='⏸ Pause'; btnPause.style.display='none';
      const btnReset = document.createElement('button'); btnReset.className='w-btn w-btn-secondary timer-btn'; btnReset.textContent='↺ Reset';

      controls.append(btnStart, btnPause, btnReset);
      body.append(display, editRow, editHint, label, controls);

      function sizeFont(){
        const w = shell.el.offsetWidth  || parseInt(shell.el.style.width)  || 400;
        const h = shell.el.offsetHeight || parseInt(shell.el.style.height) || 260;
        const btnFs  = Math.max(11, Math.min(15, Math.floor(w / 26)));
        const btnPad = Math.max(5,  Math.min(9,  Math.floor(w / 40)));
        const btnMin = Math.max(50, Math.min(90, Math.floor(w / 4.5)));
        [btnStart, btnPause, btnReset].forEach(b => {
          b.style.setProperty('font-size', btnFs + 'px', 'important');
          b.style.setProperty('padding', btnPad + 'px ' + (btnPad * 2) + 'px', 'important');
          b.style.setProperty('min-width', btnMin + 'px', 'important');
          b.style.setProperty('border-radius', '10px', 'important');
          b.style.setProperty('font-weight', '700', 'important');
        });
        // Reserve space for buttons row + padding dynamically
        const controlsH = btnFs + btnPad * 2 + 28;
        const byW = Math.floor(w / 4.2);
        const byH = Math.floor((h - controlsH) / 2.0);
        const px  = Math.max(24, Math.min(100, Math.min(byW, byH)));
        display.style.setProperty('font-size', px + 'px', 'important');
      }
      function sizeFontRetry(){ sizeFont(); setTimeout(sizeFont,50); setTimeout(sizeFont,200); }

      function render(){
        const s = state.remainSec;
        const h = Math.floor(s/3600);
        const m = Math.floor((s%3600)/60);
        const sc = s%60;
        display.textContent = h>0
          ? h+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')
          : String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
        if(s <= 0)       display.style.color = 'var(--danger, #ef4444)';
        else if(s <= 30) display.style.color = 'var(--warn,   #f59e0b)';
        else             display.style.color = 'var(--text-primary)';
        btnStart.style.display = state.running ? 'none' : '';
        btnPause.style.display = state.running ? ''     : 'none';
      }

      function beep(){
        try{
          const ctx=new(window.AudioContext||window.webkitAudioContext)();
          [0,0.3,0.6].forEach(t=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.setValueAtTime(0.4,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.25); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3); });
        }catch(e){}
      }

      let iv = null;
      function start(){
        if(state.remainSec<=0) return;
        state.running=true;
        iv=setInterval(()=>{
          state.remainSec--;
          render();
          if(state.remainSec<=0){ clearInterval(iv); iv=null; state.running=false; render(); beep(); shell.el.classList.add('timer-flash'); setTimeout(()=>shell.el.classList.remove('timer-flash'),2000); }
          debouncedSave();
        },1000);
        render();
      }
      function pause(){ if(iv){clearInterval(iv);iv=null;} state.running=false; render(); debouncedSave(); }
      function reset(){ pause(); state.remainSec=state.totalSec; render(); }

      btnStart.addEventListener('click', start);
      btnPause.addEventListener('click', pause);
      btnReset.addEventListener('click', reset);

      if(state.running){ state.running=false; }
      render();
      sizeFontRetry();

      const sett = shell.settings;
      const wid  = shell.el.dataset.wid;
      sett.innerHTML = `
        <div class="widget-settings-title">⏱️ Timer Settings</div>
        <div class="settings-row">
          <label>Minutes</label>
          <input type="number" class="w-input" style="width:70px;" min="0" max="99" value="${Math.floor(state.totalSec/60)}" id="cdm-${wid}">
          <label>Seconds</label>
          <input type="number" class="w-input" style="width:70px;" min="0" max="59" value="${state.totalSec%60}" id="cds-${wid}">
        </div>
        <button class="w-btn w-btn-primary" id="cdset-${wid}" style="margin-top:4px;">Set Time</button>
      `;
      sett.querySelector('#cdset-'+wid).addEventListener('click',()=>{
        const m=parseInt(sett.querySelector('#cdm-'+wid).value)||0;
        const s=parseInt(sett.querySelector('#cds-'+wid).value)||0;
        pause();
        state.totalSec=m*60+s;
        state.remainSec=state.totalSec;
        render();
        debouncedSave();
      });

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, display, 60);
      return {
        getState:()=>({totalSec:state.totalSec, remainSec:state.remainSec, running:state.running, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}),
        destroy:()=>{ if(iv)clearInterval(iv); },
        onResize:(w,h)=>{ sizeFont(); setTimeout(sizeFont,60); }
      };
    }

    // 3. STOPWATCH
    function createStopwatchWidget(shell, state){
      state = state || { elapsed:0, running:false, laps:[] };
      const body = shell.body;
      body.style.gap='8px';

      const display = document.createElement('div'); display.style.cssText='font-family:"Inter",system-ui,sans-serif;font-size:64px;font-weight:900;color:var(--text-primary);text-align:center;line-height:1;letter-spacing:-0.02em;';
      const btns = document.createElement('div'); btns.style.cssText='display:flex;gap:8px;justify-content:center;';
      const btnStart = document.createElement('button'); btnStart.className='w-btn w-btn-primary w-btn-lg'; btnStart.textContent='▶ Start';
      const btnLap = document.createElement('button'); btnLap.className='w-btn w-btn-secondary w-btn-lg'; btnLap.textContent='Lap';
      const btnReset = document.createElement('button'); btnReset.className='w-btn w-btn-secondary w-btn-lg'; btnReset.textContent='↺ Reset';
      btns.appendChild(btnStart); btns.appendChild(btnLap); btns.appendChild(btnReset);
      const lapList = document.createElement('div'); lapList.style.cssText='flex:1;overflow-y:auto;font-size:14px;';
      body.appendChild(display); body.appendChild(btns); body.appendChild(lapList);

      let iv=null, startTime=0, accum=state.elapsed||0;
      function fmtMs(ms){ const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; }
      function render(){ display.textContent=fmtMs(state.elapsed); btnStart.textContent=state.running?'⏸ Stop':'▶ Start'; renderLaps(); }
      function renderLaps(){
        if(state.laps.length===0){ lapList.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:8px;font-size:14px;">No laps yet</div>'; return; }
        const splits = state.laps.map((l,i)=>i===0?l:l-state.laps[i-1]);
        const best = Math.min(...splits), worst = Math.max(...splits);
        let html = '<div style="display:flex;justify-content:space-between;padding:2px 8px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border-color);margin-bottom:4px;"><span>#</span><span>Split</span><span>Total</span></div>';
        state.laps.forEach((l,i)=>{
          const sp=splits[i];
          let bg='transparent';
          if(state.laps.length>1){ if(sp===best)bg='rgba(34,197,94,0.15)'; else if(sp===worst)bg='rgba(239,68,68,0.15)'; }
          html+=`<div style="display:flex;justify-content:space-between;padding:3px 8px;border-radius:4px;background:${bg};"><span style="color:var(--text-muted);">${i+1}</span><span>${fmtMs(sp)}</span><span style="color:var(--text-muted);">${fmtMs(l)}</span></div>`;
        });
        lapList.innerHTML=html;
      }
      function startSw(){ state.running=true; startTime=performance.now(); iv=setInterval(()=>{ state.elapsed=accum+(performance.now()-startTime); render(); },30); render(); }
      function stopSw(){ state.running=false; accum=state.elapsed; if(iv){clearInterval(iv);iv=null;} render(); debouncedSave(); }

      btnStart.addEventListener('click',()=>{ state.running?stopSw():startSw(); });
      btnLap.addEventListener('click',()=>{ if(state.running){ state.laps.push(Math.round(state.elapsed)); renderLaps(); debouncedSave(); } });
      btnReset.addEventListener('click',()=>{ stopSw(); state.elapsed=0; accum=0; state.laps=[]; render(); debouncedSave(); });

      render();
      if(state.running){ state.running=false; startSw(); }

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, displayEl, 48);
      return { getState:()=>({elapsed:state.elapsed,running:state.running,laps:state.laps,bgOpacity:state.bgOpacity}), destroy:()=>{if(iv)clearInterval(iv);}, onResize:(w,h)=>{ const byW=Math.floor(w/3.8), byH=Math.floor((h-120)/1.3); display.style.setProperty('font-size', Math.max(28,Math.min(130,Math.min(byW,byH)))+'px','important'); } };
    }

    // 4. TEXT WIDGET (Rich Text with per-selection formatting)
    function createTextWidget(shell, state){
      const _themeTextDefault = (()=>{ try{ return THEMES[currentTheme]&&THEMES[currentTheme].textP?THEMES[currentTheme].textP:'#f1f5f9'; }catch(e){ return '#f1f5f9'; } })();
      state = state || { content:'', bgColor:'transparent' };
      const body = shell.body;
      body.style.display = 'flex';
      body.style.flexDirection = 'column';
      body.style.overflow = 'hidden';

      const toolbar = document.createElement('div');
      toolbar.className = 'cs-rte-toolbar';
      toolbar.style.cssText = `
        position:fixed;z-index:99999;display:none;align-items:center;gap:3px;
        background:#1e293b;border:1.5px solid rgba(255,255,255,0.18);
        border-radius:10px;padding:5px 7px;box-shadow:0 6px 24px rgba(0,0,0,0.5);
        flex-wrap:wrap;max-width:420px;
      `;
      document.body.appendChild(toolbar);

      const btn = (label, title, action, style='')=>{
        const b = document.createElement('button');
        b.title = title;
        b.innerHTML = label;
        b.style.cssText = `background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);
          color:#f1f5f9;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:15px;
          min-width:32px;transition:background 0.12s;font-family:inherit;${style}`;
        b.addEventListener('mouseenter', ()=>{ b.style.background='rgba(255,255,255,0.2)'; });
        b.addEventListener('mouseleave', ()=>{ b.style.background='rgba(255,255,255,0.08)'; });
        b.addEventListener('mousedown', (e)=>{ e.preventDefault(); action(b); });
        return b;
      };

      const sep = ()=>{ const s=document.createElement('div'); s.style.cssText='width:1px;height:22px;background:rgba(255,255,255,0.15);margin:0 2px;'; return s; };

      const szLabel = document.createElement('span');
      szLabel.textContent = 'Size:';
      szLabel.style.cssText = 'color:#94a3b8;font-size:13px;white-space:nowrap;';
      const szSel = document.createElement('select');
      szSel.style.cssText = 'background:#111827;border:1.5px solid rgba(255,255,255,0.2);color:#f1f5f9;border-radius:7px;padding:3px 6px;font-size:14px;cursor:pointer;';
      [['12','12px'],['14','14px'],['18','18px'],['24','24px'],['32','32px'],['40','40px'],['48','48px'],['64','64px'],['80','80px'],['96','96px']].forEach(([v,l])=>{
        const o=document.createElement('option'); o.value=v; o.textContent=l; szSel.appendChild(o);
      });
      szSel.value = '24';
      szSel.addEventListener('mousedown', (e)=>{ e.stopPropagation(); });
      szSel.addEventListener('change', ()=>{ document.execCommand('fontSize', false, '7'); const spans=edit.querySelectorAll('font[size="7"]'); spans.forEach(s=>{ s.removeAttribute('size'); s.style.fontSize=szSel.value+'px'; }); saveState(); });

      const tcLabel = document.createElement('span');
      tcLabel.textContent = 'Color:';
      tcLabel.style.cssText = 'color:#94a3b8;font-size:13px;white-space:nowrap;';
      const tcPicker = document.createElement('input');
      tcPicker.type = 'color';
      tcPicker.value = _themeTextDefault.startsWith('#') ? _themeTextDefault : '#f1f5f9';
      tcPicker.style.cssText = 'width:30px;height:28px;padding:1px;border:1.5px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;background:transparent;';
      tcPicker.addEventListener('mousedown', (e)=>{ e.stopPropagation(); });
      tcPicker.addEventListener('input', ()=>{ document.execCommand('foreColor', false, tcPicker.value); saveState(); });

      const hlLabel = document.createElement('span');
      hlLabel.textContent = 'Highlight:';
      hlLabel.style.cssText = 'color:#94a3b8;font-size:13px;white-space:nowrap;';
      const hlPicker = document.createElement('input');
      hlPicker.type = 'color';
      hlPicker.value = '#ffff00';
      hlPicker.style.cssText = 'width:30px;height:28px;padding:1px;border:1.5px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;background:transparent;';
      hlPicker.addEventListener('mousedown', (e)=>{ e.stopPropagation(); });
      hlPicker.addEventListener('input', ()=>{ document.execCommand('hiliteColor', false, hlPicker.value); saveState(); });

      const boldBtn  = btn('<b>B</b>',   'Bold',        ()=>{ document.execCommand('bold');      saveState(); }, 'font-weight:900;');
      const italBtn  = btn('<i>I</i>',   'Italic',      ()=>{ document.execCommand('italic');    saveState(); }, 'font-style:italic;');
      const undlBtn  = btn('<u>U</u>',   'Underline',   ()=>{ document.execCommand('underline'); saveState(); }, 'text-decoration:underline;');
      const striBtn  = btn('<s>S</s>',   'Strikethrough',()=>{ document.execCommand('strikeThrough'); saveState(); });
      const clearBtn = btn('✕ Clear',    'Clear formatting', ()=>{ document.execCommand('removeFormat'); saveState(); }, 'font-size:13px;');

      const alLBtn = btn('⬛ L', 'Align Left',    ()=>{ document.execCommand('justifyLeft');   saveState(); });
      const alCBtn = btn('⬛ C', 'Align Center',  ()=>{ document.execCommand('justifyCenter'); saveState(); });
      const alRBtn = btn('⬛ R', 'Align Right',   ()=>{ document.execCommand('justifyRight');  saveState(); });

      const olBtn  = btn('1.', 'Ordered List',   ()=>{ document.execCommand('insertOrderedList');   saveState(); });
      const ulBtn  = btn('•',  'Bullet List',    ()=>{ document.execCommand('insertUnorderedList'); saveState(); });

      toolbar.append(
        szLabel, szSel, sep(),
        boldBtn, italBtn, undlBtn, striBtn, sep(),
        tcLabel, tcPicker, hlLabel, hlPicker, sep(),
        alLBtn, alCBtn, alRBtn, sep(),
        olBtn, ulBtn, sep(),
        clearBtn
      );

      const edit = document.createElement('div');
      edit.contentEditable = 'true';
      edit.className = 'cs-text-edit';
      edit.style.cssText = `flex:1;outline:none;overflow-y:auto;padding:10px 12px;
        line-height:1.6;font-family:inherit;font-size:24px;
        background:${state.bgColor||'transparent'};
        color:${_themeTextDefault};word-wrap:break-word;`;
      edit.innerHTML = state.content || '';
      if(!state.content) {
        edit.dataset.placeholder = 'Click to type... Highlight text to format it.';
      }
      body.appendChild(edit);

      const phStyle = document.createElement('style');
      phStyle.textContent = `.cs-text-edit:empty:before{content:attr(data-placeholder);color:rgba(148,163,184,0.6);pointer-events:none;}`;
      document.head.appendChild(phStyle);

      let hideTimer = null;

      function positionToolbar(){
        const sel = window.getSelection();
        if(!sel || sel.isCollapsed || !sel.rangeCount) { hideToolbar(); return; }
        const range = sel.getRangeAt(0);
        if(!edit.contains(range.commonAncestorContainer)) { hideToolbar(); return; }
        if(sel.toString().trim()==='') { hideToolbar(); return; }

        toolbar.style.display = 'flex';
        const rect = range.getBoundingClientRect();
        let top = rect.top + window.scrollY - toolbar.offsetHeight - 8;
        let left = rect.left + window.scrollX + rect.width/2 - toolbar.offsetWidth/2;
        if(top < 4) top = rect.bottom + window.scrollY + 6;
        left = Math.max(4, Math.min(left, window.innerWidth - toolbar.offsetWidth - 4));
        toolbar.style.top  = top + 'px';
        toolbar.style.left = left + 'px';

        const node = sel.getRangeAt(0).startContainer;
        const el = node.nodeType===3 ? node.parentElement : node;
        const fs = parseInt(window.getComputedStyle(el).fontSize);
        const closest = [12,14,18,24,32,40,48,64,80,96].reduce((a,b)=>Math.abs(b-fs)<Math.abs(a-fs)?b:a);
        szSel.value = String(closest);
      }

      function hideToolbar(){
        toolbar.style.display = 'none';
      }

      document.addEventListener('selectionchange', ()=>{
        clearTimeout(hideTimer);
        hideTimer = setTimeout(positionToolbar, 80);
      });

      toolbar.addEventListener('mouseleave', ()=>{
        hideTimer = setTimeout(hideToolbar, 400);
      });
      toolbar.addEventListener('mouseenter', ()=>{ clearTimeout(hideTimer); });

      function saveState(){
        state.content = edit.innerHTML;
        state.bgColor = edit.style.background || 'transparent';
        debouncedSave();
      }

      edit.addEventListener('input', saveState);
      edit.addEventListener('blur', saveState);

      const sett = shell.settings;
      const wid = shell.el.dataset.wid;
      sett.innerHTML = `
        <div class="widget-settings-title">✏️ Text Box Settings</div>
        <div class="settings-row">
          <label>Box Bg</label>
          <input type="color" id="tbg-${wid}" value="${(state.bgColor&&state.bgColor!=='transparent')?state.bgColor:'#1e293b'}">
          <button class="w-btn w-btn-secondary" id="tbgclr-${wid}" style="font-size:13px;padding:4px 10px;">No Bg</button>
        </div>
        <div class="settings-row" style="margin-top:4px;">
          <label style="color:#94a3b8;font-size:13px;line-height:1.4;">💡 Tip: Highlight text in the box to change its size, color, bold, etc.</label>
        </div>
      `;
      sett.querySelector('#tbg-'+wid).addEventListener('input',(e)=>{ edit.style.background=e.target.value; saveState(); });
      sett.querySelector('#tbgclr-'+wid).addEventListener('click',()=>{ edit.style.background='transparent'; state.bgColor='transparent'; debouncedSave(); });

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, edit, 18);
      return {
        getState:()=>{ state.content=edit.innerHTML; return {...state, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}; },
        destroy:()=>{ toolbar.remove(); phStyle.remove(); },
        onResize:()=>{}
      };
    }

    // 5. DIRECTIONS (Outline-style)
    function createDirectionsWidget(shell, state){
      if(state && state.steps && !state.items){
        state.items = state.steps.map(s=>({ text: typeof s==='string'?s:s.text||'', level:0 }));
        delete state.steps;
      }
      state = state || { title:'Directions', items:[
        {text:'Read the instructions carefully', level:0},
        {text:'Gather your materials', level:0},
        {text:'Pencil', level:1},
        {text:'Notebook', level:1},
        {text:'Complete the activity', level:0},
        {text:'Turn in your work', level:0}
      ], bulletSet:0, fontSize:20 };
      if(!state.items) state.items=[{text:'New item',level:0}];
      if(state.bulletSet===undefined) state.bulletSet=0;
      if(!state.fontSize) state.fontSize=20;

      const BULLET_SETS = [
        { name:'⭐ Stars',   bullets:['⭐','🔹','🔸','💡'] },
        { name:'📌 School',  bullets:['📌','✏️','📎','🔖'] },
        { name:'🌿 Nature',  bullets:['🌟','🍀','🌸','🌱'] },
        { name:'🎯 Focus',   bullets:['🎯','▶️','🔺','🔸'] },
        { name:'🐾 Fun',     bullets:['🐾','🦋','🌈','✨'] },
        { name:'1. Numbers', bullets:['NUM','a.','i.','·'] },
      ];

      const body = shell.body;
      body.style.cssText += 'display:flex;flex-direction:column;overflow:hidden;padding:0;';

      const titleEl = document.createElement('div');
      titleEl.contentEditable = 'true';
      titleEl.className = 'cs-outline-title';
      titleEl.style.cssText = 'font-size:24px;font-weight:900;color:var(--text-primary);outline:none;padding:10px 12px 6px;border-bottom:1.5px solid rgba(255,255,255,0.08);flex-shrink:0;';
      titleEl.textContent = state.title || 'Directions';
      titleEl.addEventListener('blur', ()=>{ state.title=titleEl.textContent.trim()||'Directions'; debouncedSave(); });
      titleEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); listEl.querySelector('.cs-outline-item')?.focus(); } });

      const listEl = document.createElement('div');
      listEl.style.cssText = 'flex:1;overflow-y:auto;padding:8px 8px 8px 6px;display:flex;flex-direction:column;gap:2px;';

      body.appendChild(titleEl);
      body.appendChild(listEl);

      let numbering = [];

      function getBullet(level, itemIndex){
        const bs = BULLET_SETS[state.bulletSet] || BULLET_SETS[0];
        const l  = Math.min(level, bs.bullets.length - 1);
        if(bs.bullets[0]==='NUM'){
          return numbering[itemIndex] + (level===0 ? '.' : level===1 ? ')' : '.');
        }
        return bs.bullets[l];
      }

      function updateNumbering(items){
        const counters = [0,0,0,0];
        numbering = items.map(item=>{
          const l = item.level;
          counters[l]++;
          for(let i=l+1;i<4;i++) counters[i]=0;
          if(l===0) return counters[0];
          if(l===1) return String.fromCharCode(96+counters[1]);
          if(l===2) return ['i','ii','iii','iv','v','vi','vii','viii','ix','x'][counters[2]-1]||counters[2];
          return counters[3];
        });
      }

      function renderItems(){
        updateNumbering(state.items);
        const focusedIdx = parseInt(listEl.dataset.focusIdx||'-1');
        listEl.innerHTML = '';
        state.items.forEach((item, idx)=>{
          const row = document.createElement('div');
          row.style.cssText = `display:flex;align-items:flex-start;gap:6px;padding:3px 4px;border-radius:8px;
            padding-left:${8 + item.level * 28}px;transition:background 0.1s;`;
          row.addEventListener('mouseenter', ()=>{ row.style.background='rgba(255,255,255,0.05)'; });
          row.addEventListener('mouseleave', ()=>{ row.style.background='transparent'; });

          const bullet = document.createElement('span');
          bullet.style.cssText = `flex-shrink:0;font-size:${state.fontSize * 0.9}px;line-height:1.5;
            min-width:${state.fontSize + 6}px;text-align:center;user-select:none;`;
          bullet.textContent = getBullet(item.level, idx);

          const txt = document.createElement('span');
          txt.className = 'cs-outline-item';
          txt.contentEditable = 'true';
          txt.style.cssText = `flex:1;outline:none;font-size:${state.fontSize}px;
            color:var(--text-primary);line-height:1.5;word-break:break-word;
            font-weight:${item.level===0?'700':'400'};`;
          txt.textContent = item.text;
          txt.dataset.idx = idx;

          txt.addEventListener('blur', ()=>{
            item.text = txt.textContent.trim();
            if(item.text==='') { state.items.splice(idx,1); renderItems(); }
            else debouncedSave();
          });

          txt.addEventListener('keydown', e=>{
            const i = parseInt(txt.dataset.idx);
            if(e.key==='Enter'){
              e.preventDefault();
              state.items.splice(i+1, 0, {text:'', level:item.level});
              listEl.dataset.focusIdx = i+1;
              renderItems();
              const newItem = listEl.querySelectorAll('.cs-outline-item')[i+1];
              if(newItem){ newItem.focus(); placeCaretAtEnd(newItem); }
            } else if(e.key==='Tab'){
              e.preventDefault();
              if(e.shiftKey){ if(item.level>0){ item.text=txt.textContent; item.level--; renderItems(); refocus(i); } }
              else           { if(item.level<3){ item.text=txt.textContent; item.level++; renderItems(); refocus(i); } }
              debouncedSave();
            } else if(e.key==='Backspace' && txt.textContent===''){
              e.preventDefault();
              if(state.items.length>1){
                state.items.splice(i,1);
                listEl.dataset.focusIdx = Math.max(0,i-1);
                renderItems();
                refocus(Math.max(0,i-1));
              }
            } else if(e.key==='ArrowUp' && i>0){
              e.preventDefault(); refocus(i-1);
            } else if(e.key==='ArrowDown' && i<state.items.length-1){
              e.preventDefault(); refocus(i+1);
            }
          });

          txt.addEventListener('input', ()=>{ item.text=txt.textContent; debouncedSave(); });

          row.appendChild(bullet);
          row.appendChild(txt);
          listEl.appendChild(row);
        });
      }

      function refocus(idx){
        const items = listEl.querySelectorAll('.cs-outline-item');
        if(items[idx]){ items[idx].focus(); placeCaretAtEnd(items[idx]); }
      }

      function placeCaretAtEnd(el){
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      renderItems();

      const sett = shell.settings;
      const wid  = shell.el.dataset.wid;

      function buildSettings(){
        sett.innerHTML = '';

        const title = document.createElement('div');
        title.className = 'widget-settings-title';
        title.textContent = '📋 Outline Settings';
        sett.appendChild(title);

        const bsRow = document.createElement('div');
        bsRow.className = 'settings-row';
        bsRow.innerHTML = '<label>Bullets</label>';
        const bsSel = document.createElement('select');
        bsSel.className = 'w-select';
        bsSel.style.flex = '1';
        BULLET_SETS.forEach((bs,i)=>{
          const o=document.createElement('option'); o.value=i; o.textContent=bs.name; bsSel.appendChild(o);
        });
        bsSel.value = state.bulletSet;
        bsSel.addEventListener('change',()=>{ state.bulletSet=parseInt(bsSel.value); renderItems(); debouncedSave(); });
        bsRow.appendChild(bsSel);
        sett.appendChild(bsRow);

        const fsRow = document.createElement('div');
        fsRow.className = 'settings-row';
        fsRow.innerHTML = '<label>Text Size</label>';
        const fsSel = document.createElement('select');
        fsSel.className = 'w-select';
        fsSel.style.flex='1';
        [['Small','16'],['Medium','20'],['Large','26'],['X-Large','32']].forEach(([l,v])=>{
          const o=document.createElement('option'); o.value=v; o.textContent=l; fsSel.appendChild(o);
        });
        fsSel.value = String(state.fontSize||20);
        fsSel.addEventListener('change',()=>{ state.fontSize=parseInt(fsSel.value); renderItems(); debouncedSave(); });
        fsRow.appendChild(fsSel);
        sett.appendChild(fsRow);

        const addRow = document.createElement('div');
        addRow.style.cssText='display:flex;gap:6px;margin-top:6px;';
        const addInp = document.createElement('input');
        addInp.className='w-input'; addInp.style.flex='1'; addInp.placeholder='Add item...';
        const addBtn = document.createElement('button');
        addBtn.className='w-btn w-btn-primary'; addBtn.textContent='+';
        addBtn.addEventListener('click',()=>{
          if(addInp.value.trim()){ state.items.push({text:addInp.value.trim(),level:0}); addInp.value=''; renderItems(); debouncedSave(); }
        });
        addInp.addEventListener('keydown',e=>{ if(e.key==='Enter') addBtn.click(); });
        addRow.append(addInp, addBtn);
        sett.appendChild(addRow);

        const clrBtn = document.createElement('button');
        clrBtn.className='w-btn w-btn-danger'; clrBtn.style.cssText='width:100%;margin-top:6px;';
        clrBtn.textContent='🗑️ Clear All Items';
        clrBtn.addEventListener('click',()=>{ if(confirm('Clear all outline items?')){ state.items=[{text:'New item',level:0}]; renderItems(); debouncedSave(); } });
        sett.appendChild(clrBtn);

        const tip = document.createElement('div');
        tip.style.cssText='margin-top:10px;font-size:13px;color:var(--text-muted);line-height:1.6;';
        tip.innerHTML='<b>Tips:</b><br>↵ Enter → new item<br>⇥ Tab → indent right<br>⇧⇥ Shift+Tab → indent left<br>⌫ Backspace on empty → delete';
        sett.appendChild(tip);
      }

      buildSettings();

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, listEl, 18);
      return {
        getState: ()=>({ title:state.title, items:[...state.items], bulletSet:state.bulletSet, fontSize:state.fontSize, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false }),
        destroy:  ()=>{},
        onResize: ()=>{}
      };
    }

    // 6. TRAFFIC LIGHT
    function createTrafficLightWidget(shell, state){
      state = state || { active:'green', labels:{red:'Stop',yellow:'Caution',green:'Go'}, autoMode:false, autoInterval:5 };
      const body = shell.body;
      body.style.alignItems='center'; body.style.justifyContent='center'; body.style.gap='0';

      const lightBox = document.createElement('div'); lightBox.style.cssText='background:rgba(0,0,0,0.4);border-radius:24px;padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;';

      const colors = {red:'#ef4444',yellow:'#f59e0b',green:'#22c55e'};
      const lights = {};
      ['red','yellow','green'].forEach(c=>{
        const circle = document.createElement('div');
        circle.style.cssText=`width:80px;height:80px;border-radius:50%;background:${colors[c]};opacity:0.2;cursor:pointer;transition:all 0.3s;`;
        circle.dataset.color=c;
        circle.addEventListener('click',()=>{ state.active=c; renderLights(); debouncedSave(); });
        lights[c]=circle;
        lightBox.appendChild(circle);
      });

      const labelEl = document.createElement('div'); labelEl.style.cssText='font-size:28px;font-weight:900;text-align:center;margin-top:12px;color:var(--text-primary);letter-spacing:0.04em;';
      body.appendChild(lightBox); body.appendChild(labelEl);

      function renderLights(){
        ['red','yellow','green'].forEach(c=>{
          const active = state.active===c;
          lights[c].style.opacity = active?'1':'0.2';
          lights[c].style.boxShadow = active?`0 0 30px ${colors[c]}, 0 0 60px ${colors[c]}40`:'none';
          lights[c].classList.toggle('traffic-active', active);
        });
        labelEl.textContent = state.labels[state.active]||'';
        labelEl.style.color = colors[state.active];
      }
      renderLights();

      let autoIv=null;
      function startAuto(){
        const order=['green','yellow','red'];
        autoIv=setInterval(()=>{ let idx=order.indexOf(state.active); state.active=order[(idx+1)%3]; renderLights(); debouncedSave(); },(state.autoInterval||5)*1000);
      }
      if(state.autoMode) startAuto();

      const sett=shell.settings;
      sett.innerHTML=`<div class="widget-settings-title">🚦 Traffic Light Settings</div><div class="settings-row"><label>Red</label><input class="w-input" style="flex:1;" value="${state.labels.red}" id="tlr-${shell.el.dataset.wid}"></div><div class="settings-row"><label>Yellow</label><input class="w-input" style="flex:1;" value="${state.labels.yellow}" id="tly-${shell.el.dataset.wid}"></div><div class="settings-row"><label>Green</label><input class="w-input" style="flex:1;" value="${state.labels.green}" id="tlg-${shell.el.dataset.wid}"></div><div class="settings-row"><label>Auto</label><input type="checkbox" id="tla-${shell.el.dataset.wid}" ${state.autoMode?'checked':''}><label>Sec</label><input type="number" class="w-input" style="width:50px;" min="1" max="60" value="${state.autoInterval||5}" id="tlai-${shell.el.dataset.wid}"></div>`;
      ['r','y','g'].forEach((k,i)=>{
        const key=['red','yellow','green'][i];
        sett.querySelector('#tl'+k+'-'+shell.el.dataset.wid).addEventListener('input',(e)=>{ state.labels[key]=e.target.value; renderLights(); debouncedSave(); });
      });
      sett.querySelector('#tla-'+shell.el.dataset.wid).addEventListener('change',(e)=>{ state.autoMode=e.target.checked; if(autoIv){clearInterval(autoIv);autoIv=null;} if(state.autoMode)startAuto(); debouncedSave(); });
      sett.querySelector('#tlai-'+shell.el.dataset.wid).addEventListener('change',(e)=>{ state.autoInterval=parseInt(e.target.value)||5; if(autoIv){clearInterval(autoIv);autoIv=null;} if(state.autoMode)startAuto(); debouncedSave(); });

      addTransparencyControl(shell, state, debouncedSave);
      return { getState:()=>({...state, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}), destroy:()=>{if(autoIv)clearInterval(autoIv);}, onResize:(w,h)=>{ const sz=Math.max(50,Math.min(130,(Math.min(w,h-80)*0.26))); Object.values(lights).forEach(l=>{l.style.width=sz+'px';l.style.height=sz+'px';}); labelEl.style.fontSize=Math.max(20,Math.min(40,w*0.1))+'px'; } };
    }

    // 7. RANDOM NAME PICKER
    function createNamePickerWidget(shell, state){
      state = state || { names:['Alice','Bob','Charlie','Diana','Ethan','Fiona','George','Hannah'], picked:[], excludePicked:false, currentPick:'' };
      const body = shell.body;
      body.style.alignItems='center'; body.style.gap='10px';

      const pickDisplay = document.createElement('div'); pickDisplay.style.cssText='font-size:56px;font-weight:900;color:var(--accent);text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;width:100%;line-height:1.1;letter-spacing:-0.02em;';
      pickDisplay.textContent = state.currentPick || '?';
      const btnPick = document.createElement('button'); btnPick.className='w-btn w-btn-primary w-btn-lg'; btnPick.style.cssText='font-size:22px;padding:12px 36px;font-weight:800;'; btnPick.textContent='🎲 Pick!';
      const historyEl = document.createElement('div'); historyEl.style.cssText='flex:1;overflow-y:auto;width:100%;font-size:14px;color:var(--text-muted);';
      const histLabel = document.createElement('div'); histLabel.style.cssText='font-size:15px;font-weight:700;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.06em;'; histLabel.textContent='HISTORY';
      body.appendChild(pickDisplay); body.appendChild(btnPick); body.appendChild(histLabel); body.appendChild(historyEl);

      function renderHistory(){
        historyEl.innerHTML=state.picked.map((n,i)=>`<div style="padding:2px 0;">${state.picked.length-i}. ${n}</div>`).join('');
      }
      renderHistory();

      function confetti(){
        for(let i=0;i<20;i++){
          const dot=document.createElement('div');
          const angle=Math.random()*360, dist=60+Math.random()*80;
          const color=['#ef4444','#f59e0b','#22c55e','#6366f1','#ec4899','#8b5cf6','#14b8a6'][Math.floor(Math.random()*7)];
          dot.style.cssText=`position:absolute;width:8px;height:8px;border-radius:50%;background:${color};top:50%;left:50%;pointer-events:none;z-index:10;`;
          const tx=Math.cos(angle*Math.PI/180)*dist, ty=Math.sin(angle*Math.PI/180)*dist;
          dot.style.transition='all 0.6s ease-out';
          pickDisplay.appendChild(dot);
          requestAnimationFrame(()=>{
            dot.style.transform=`translate(${tx}px,${ty}px) scale(0)`;
            dot.style.opacity='0';
          });
          setTimeout(()=>dot.remove(),700);
        }
      }

      btnPick.addEventListener('click',()=>{
        let pool = state.excludePicked ? state.names.filter(n=>!state.picked.includes(n)) : [...state.names];
        if(pool.length===0){ pickDisplay.textContent='All picked!'; return; }
        btnPick.disabled=true;
        let count=0, maxCount=20;
        const spinIv=setInterval(()=>{
          pickDisplay.textContent=pool[Math.floor(Math.random()*pool.length)];
          count++;
          if(count>=maxCount){
            clearInterval(spinIv);
            const winner=pool[Math.floor(Math.random()*pool.length)];
            state.currentPick=winner;
            pickDisplay.textContent=winner;
            state.picked.unshift(winner);
            renderHistory();
            confetti();
            btnPick.disabled=false;
            debouncedSave();
          }
        },60);
      });

      const sett=shell.settings;
      sett.innerHTML=`<div class="widget-settings-title">🎲 Name Picker Settings</div><div style="margin-bottom:6px;"><label style="display:block;margin-bottom:4px;">Names (one per line)</label><textarea class="w-input" style="width:100%;height:80px;resize:vertical;" id="npt-${shell.el.dataset.wid}">${state.names.join('\n')}</textarea></div><div class="settings-row"><input type="checkbox" id="npx-${shell.el.dataset.wid}" ${state.excludePicked?'checked':''}><label>Exclude picked names</label></div><button class="w-btn w-btn-secondary" id="npra-${shell.el.dataset.wid}" style="width:100%;">Reset History</button>`;
      sett.querySelector('#npt-'+shell.el.dataset.wid).addEventListener('blur',(e)=>{ state.names=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean); debouncedSave(); });
      sett.querySelector('#npx-'+shell.el.dataset.wid).addEventListener('change',(e)=>{ state.excludePicked=e.target.checked; debouncedSave(); });
      sett.querySelector('#npra-'+shell.el.dataset.wid).addEventListener('click',()=>{ state.picked=[]; state.currentPick=''; pickDisplay.textContent='?'; renderHistory(); debouncedSave(); });

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, pickedEl, 32);
      return { getState:()=>({...state, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}), destroy:()=>{}, onResize:(w,h)=>{ const sz=Math.max(36,Math.min(90,w*0.18)); pickDisplay.style.setProperty('font-size',sz+'px','important'); } };
    }

    // 8. TO-DO LIST
    function createTodoWidget(shell, state){
      state = state || { title:'To-Do List', items:[], filter:'all', nextId:1 };
      const body = shell.body; body.style.gap='6px';

      const titleEl = document.createElement('div');

      titleEl.textContent=state.title;

      const filterBar = document.createElement('div'); filterBar.style.cssText='display:flex;gap:4px;flex-shrink:0;';
      ['all','active','done'].forEach(f=>{
        const btn=document.createElement('button'); btn.className='w-btn w-btn-secondary'; btn.style.fontSize='15px'; btn.style.padding='5px 14px';
        btn.textContent=f.charAt(0).toUpperCase()+f.slice(1); btn.dataset.filter=f;

      addRow.appendChild(addInp); addRow.appendChild(addBtn);

      body.appendChild(titleEl); body.appendChild(filterBar); body.appendChild(listEl); body.appendChild(addRow);

      function addItem(text){
        state.items.push({id:state.nextId++,text,done:false});
        renderItems(); debouncedSave();
      }
      function renderItems(){
        const filtered = state.filter==='all'?state.items:state.filter==='active'?state.items.filter(i=>!i.done):state.items.filter(i=>i.done);
        filterBar.querySelectorAll('button').forEach(b=>{ b.classList.toggle('active', b.dataset.filter===state.filter); if(b.dataset.filter===state.filter){b.style.background='var(--accent)';b.style.color='white';}else{b.style.background='';b.style.color='';} });
        listEl.innerHTML='';
        filtered.forEach(item=>{
          const row=document.createElement('div'); row.className='todo-item'+(item.done?' done':'');
          const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=item.done; cb.style.cssText='accent-color:var(--accent);cursor:pointer;width:22px;height:22px;flex-shrink:0;';
          const txt=document.createElement('span'); txt.className='todo-text'; txt.style.cssText='flex:1;font-size:18px;color:var(--text-primary);line-height:1.4;';
          txt.textContent=item.text;
          const del=document.createElement('button'); del.className='del-btn'; del.style.cssText='background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:2px 4px;'; del.textContent='✕';
          cb.addEventListener('change',()=>{ item.done=cb.checked; renderItems(); debouncedSave(); });
          del.addEventListener('click',()=>{ state.items=state.items.filter(i=>i.id!==item.id); renderItems(); debouncedSave(); });
          row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
          listEl.appendChild(row);
        });
      }

      addBtn.addEventListener('click',()=>{ if(addInp.value.trim()){addItem(addInp.value.trim());addInp.value='';} });
      addInp.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&addInp.value.trim()){addItem(addInp.value.trim());addInp.value='';} });

      renderItems();

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, listEl, 18);
      return { getState:()=>({...state, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false}), destroy:()=>{}, onResize:()=>{} };
    }

    // 9. NOISE METER
    function createNoiseMeterWidget(shell, state){
      state = state || { enabled:false, threshold:70 };
      const body = shell.body;
      body.style.alignItems='center'; body.style.justifyContent='center'; body.style.gap='10px';

      const meterWrap = document.createElement('div'); meterWrap.style.cssText='width:100%;height:56px;background:rgba(255,255,255,0.06);border-radius:12px;overflow:hidden;position:relative;';
      const meterBar = document.createElement('div'); meterBar.className='noise-bar'; meterBar.style.width='0%'; meterBar.style.background='#22c55e';
      const meterLabel = document.createElement('div'); meterLabel.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text-primary);';
      meterLabel.textContent='--';
      meterWrap.appendChild(meterBar); meterWrap.appendChild(meterLabel);

      const statusEl = document.createElement('div'); statusEl.style.cssText='font-size:18px;color:var(--text-muted);text-align:center;font-weight:500;';
      statusEl.textContent='Click "Enable Mic" to start';

      const btnMic = document.createElement('button'); btnMic.className='w-btn w-btn-primary w-btn-lg'; btnMic.style.cssText='font-size:20px;padding:12px 28px;font-weight:700;'; btnMic.textContent='🎤 Enable Mic';
      body.appendChild(meterWrap); body.appendChild(statusEl); body.appendChild(btnMic);

      let audioCtx, analyser, mic, animFrame, stream;
      function startMic(){
        navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
          stream=s;
          audioCtx=new(window.AudioContext||window.webkitAudioContext)();
          analyser=audioCtx.createAnalyser(); analyser.fftSize=512;
          mic=audioCtx.createMediaStreamSource(s); mic.connect(analyser);
          state.enabled=true;
          btnMic.textContent='🔇 Disable Mic';
          statusEl.textContent='Listening...';
          pump();
        }).catch(()=>{ statusEl.textContent='Microphone access denied'; });
      }
      function stopMic(){
        state.enabled=false;
        if(animFrame) cancelAnimationFrame(animFrame);
        if(stream) stream.getTracks().forEach(t=>t.stop());
        if(audioCtx) audioCtx.close();
        btnMic.textContent='🎤 Enable Mic';
        statusEl.textContent='Microphone disabled';
        meterBar.style.width='0%';
        meterLabel.textContent='--';
        shell.el.style.borderColor='var(--border-color)';
      }
      function pump(){
        const data=new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
        const avg=sum/data.length;
        const pct=Math.min(100,avg/1.28);
        meterBar.style.width=pct+'%';
        meterBar.style.background=pct<40?'#22c55e':pct<70?'#f59e0b':'#ef4444';
        meterLabel.textContent=Math.round(pct)+'%';
        if(pct>state.threshold){ shell.el.style.borderColor='#ef4444'; shell.el.style.boxShadow='0 0 20px rgba(239,68,68,0.4)'; }
        else { shell.el.style.borderColor='var(--border-color)'; shell.el.style.boxShadow='var(--shadow-widget)'; }
        animFrame=requestAnimationFrame(pump);
      }
      btnMic.addEventListener('click',()=>{ state.enabled?stopMic():startMic(); });

      const sett=shell.settings;
      sett.innerHTML=`<div class="settings-row"><label>Threshold</label><input type="range" min="20" max="95" value="${state.threshold}" id="nt-${shell.el.dataset.wid}" style="flex:1;"><span id="ntv-${shell.el.dataset.wid}">${state.threshold}%</span></div>`;
      sett.querySelector('#nt-'+shell.el.dataset.wid).addEventListener('input',(e)=>{ state.threshold=parseInt(e.target.value); sett.querySelector('#ntv-'+shell.el.dataset.wid).textContent=state.threshold+'%'; debouncedSave(); });

      addTransparencyControl(shell, state, debouncedSave);
      return { getState:()=>({threshold:state.threshold,enabled:false,bgOpacity:state.bgOpacity,hideHeader:state.hideHeader||false}), destroy:()=>{stopMic();}, onResize:()=>{} };
    }

    // ===== WIDGET FACTORY =====

    // ===== UNIVERSAL FONT SIZE CONTROL =====
    function addFontSizeControl(shell, state, debouncedSaveFn, targetEl, defaultSize){
      if(!shell || !shell.settings) return;
      if(state.fontSize === undefined) state.fontSize = defaultSize || 24;
      if(targetEl) targetEl.style.setProperty('font-size', state.fontSize + 'px', 'important');

      const sett = shell.settings;
      const div = document.createElement('div');
      div.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);';

      const label = document.createElement('div');
      label.style.cssText = 'font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;';
      label.textContent = 'Font Size';
      div.appendChild(label);

      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;';

      const slider = document.createElement('input');
      slider.type='range'; slider.min='12'; slider.max='120'; slider.step='2';
      slider.value = state.fontSize;
      slider.style.cssText = 'flex:1;accent-color:#6366f1;cursor:pointer;';

      const val = document.createElement('span');
      val.style.cssText = 'font-size:12px;color:#f1f5f9;min-width:34px;text-align:right;';
      val.textContent = state.fontSize + 'px';

      slider.addEventListener('input', ()=>{
        state.fontSize = parseInt(slider.value);
        val.textContent = state.fontSize + 'px';
        if(targetEl){
          targetEl.style.setProperty('font-size', state.fontSize + 'px', 'important');
          // Also stamp a data attribute so sizeFont() can check it
          targetEl.dataset.userFontSize = state.fontSize;
        }
        // Trigger widget's own onResize so it re-lays out with new size
        if(shell && shell.widget && typeof shell.widget.onResize === 'function'){
          const w = shell.el.offsetWidth || 400;
          const h = shell.el.offsetHeight || 260;
          shell.widget.onResize(w, h);
        }
        // Re-apply after onResize in case it was overridden
        if(targetEl){
          requestAnimationFrame(()=>{
            targetEl.style.setProperty('font-size', state.fontSize + 'px', 'important');
          });
        }
        if(debouncedSaveFn) debouncedSaveFn();
      });
      row.append(slider, val);
      div.append(row);
      sett.appendChild(div);
    }

    const CREATORS = { datetime:createDateTimeWidget, datewidget:createDateWidget, countdown:createCountdownWidget, stopwatch:createStopwatchWidget, text:createTextWidget, directions:createDirectionsWidget, trafficlight:createTrafficLightWidget, namepicker:createNamePickerWidget, todo:createTodoWidget, noise:createNoiseMeterWidget, scoreboard:createScoreboardWidget, clipart:createClipartWidget, video:createVideoWidget, soundboard:createSoundboardWidget };

    // 10. SCOREBOARD
    function createScoreboardWidget(shell, state){
      const TEAM_COLORS = ['#f87171','#60a5fa','#4ade80','#facc15','#f472b6','#a78bfa','#fb923c','#34d399'];
      state = state || { title:'Scoreboard', teams:[
        { name:'Team 1', score:0, color:'#f87171' },
        { name:'Team 2', score:0, color:'#60a5fa' },
      ], fontSize:'medium' };
      if(!state.teams) state.teams = [];
      if(!state.title) state.title = 'Scoreboard';
      if(!state.fontSize) state.fontSize = 'medium';

      const body = shell.body;
      body.style.cssText += 'display:flex;flex-direction:column;overflow:hidden;padding:0;';

      // Title
      const titleEl = document.createElement('div');
      titleEl.contentEditable = 'true';
      titleEl.style.cssText = 'font-size:20px;font-weight:900;color:var(--text-primary);outline:none;padding:8px 12px 4px;border-bottom:1.5px solid rgba(255,255,255,0.08);flex-shrink:0;text-align:center;letter-spacing:0.02em;';
      titleEl.textContent = state.title;
      titleEl.addEventListener('blur',()=>{ state.title = titleEl.textContent.trim()||'Scoreboard'; debouncedSave(); });
      body.appendChild(titleEl);

      // Teams container
      const teamsEl = document.createElement('div');
      teamsEl.style.cssText = 'flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;';
      body.appendChild(teamsEl);

      const FONT_SIZES = { small:{score:'28px',name:'12px'}, medium:{score:'40px',name:'14px'}, large:{score:'56px',name:'16px'} };

      function renderTeams(){
        teamsEl.innerHTML = '';
        const fs = FONT_SIZES[state.fontSize] || FONT_SIZES.medium;
        state.teams.forEach((team, idx) => {
          const row = document.createElement('div');
          row.style.cssText = `display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);
            border-radius:12px;padding:6px 10px;border-left:4px solid ${team.color};transition:background 0.15s;`;

          // Color dot
          const dot = document.createElement('div');
          dot.style.cssText = `width:12px;height:12px;border-radius:50%;background:${team.color};flex-shrink:0;cursor:pointer;`;
          dot.title = 'Change color';
          let colorIdx = TEAM_COLORS.indexOf(team.color);
          dot.addEventListener('click',()=>{
            colorIdx = (colorIdx + 1) % TEAM_COLORS.length;
            team.color = TEAM_COLORS[colorIdx];
            renderTeams(); debouncedSave();
          });

          // Name
          const nameEl = document.createElement('span');
          nameEl.contentEditable = 'true';
          nameEl.style.cssText = `flex:1;font-size:${fs.name};font-weight:700;color:var(--text-primary);outline:none;min-width:0;`;
          nameEl.textContent = team.name;
          nameEl.addEventListener('blur',()=>{ team.name = nameEl.textContent.trim()||('Team '+(idx+1)); debouncedSave(); });
          nameEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();nameEl.blur();} });

          // Score display
          const scoreEl = document.createElement('span');
          scoreEl.style.cssText = `font-size:${fs.score};font-weight:900;color:${team.color};
            min-width:64px;text-align:center;line-height:1;font-variant-numeric:tabular-nums;`;
          scoreEl.textContent = team.score;

          // Buttons
          const btnGrp = document.createElement('div');
          btnGrp.style.cssText = 'display:flex;flex-direction:column;gap:2px;';

          const mkBtn = (label, delta, bg) => {
            const b = document.createElement('button');
            b.textContent = label;
            b.style.cssText = `background:${bg};border:none;color:#fff;border-radius:6px;
              width:28px;height:22px;font-size:13px;font-weight:800;cursor:pointer;line-height:1;
              display:flex;align-items:center;justify-content:center;transition:filter 0.1s;`;
            b.addEventListener('mouseenter',()=>b.style.filter='brightness(1.25)');
            b.addEventListener('mouseleave',()=>b.style.filter='');
            b.addEventListener('click',()=>{ team.score += delta; scoreEl.textContent = team.score; debouncedSave(); });
            return b;
          };
          btnGrp.appendChild(mkBtn('+', 1, 'rgba(74,222,128,0.7)'));
          btnGrp.appendChild(mkBtn('−', -1, 'rgba(248,113,113,0.7)'));

          row.append(dot, nameEl, scoreEl, btnGrp);
          teamsEl.appendChild(row);
        });
      }

      renderTeams();

      // Settings
      const sett = shell.settings;
      sett.innerHTML = '';

      const stitle = document.createElement('div');
      stitle.className = 'widget-settings-title';
      stitle.textContent = '🏆 Scoreboard Settings';
      sett.appendChild(stitle);

      // Font size
      const fsRow = document.createElement('div'); fsRow.className='settings-row';
      fsRow.innerHTML='<label>Score Size</label>';
      const fsSel = document.createElement('select'); fsSel.className='w-select'; fsSel.style.flex='1';
      [['Small','small'],['Medium','medium'],['Large','large']].forEach(([l,v])=>{
        const o=document.createElement('option'); o.value=v; o.textContent=l; fsSel.appendChild(o);
      });
      fsSel.value = state.fontSize;
      fsSel.addEventListener('change',()=>{ state.fontSize=fsSel.value; renderTeams(); debouncedSave(); });
      fsRow.appendChild(fsSel); sett.appendChild(fsRow);

      // Add team
      const addRow = document.createElement('div'); addRow.style.cssText='display:flex;gap:6px;margin-top:4px;';
      const addInp = document.createElement('input'); addInp.className='w-input'; addInp.style.flex='1'; addInp.placeholder='Team name...';
      const addBtn = document.createElement('button'); addBtn.className='w-btn w-btn-primary'; addBtn.textContent='+';
      addBtn.addEventListener('click',()=>{
        const name = addInp.value.trim() || 'Team '+(state.teams.length+1);
        const color = TEAM_COLORS[state.teams.length % TEAM_COLORS.length];
        state.teams.push({name, score:0, color});
        addInp.value=''; renderTeams(); debouncedSave();
      });
      addInp.addEventListener('keydown',e=>{ if(e.key==='Enter') addBtn.click(); });
      addRow.append(addInp, addBtn); sett.appendChild(addRow);

      // Remove last team
      const remBtn = document.createElement('button'); remBtn.className='w-btn'; remBtn.style.cssText='width:100%;margin-top:4px;font-size:12px;';
      remBtn.textContent='Remove Last Team';
      remBtn.addEventListener('click',()=>{ if(state.teams.length>1){ state.teams.pop(); renderTeams(); debouncedSave(); } });
      sett.appendChild(remBtn);

      // Reset scores
      const resetBtn = document.createElement('button'); resetBtn.className='w-btn w-btn-danger'; resetBtn.style.cssText='width:100%;margin-top:4px;';
      resetBtn.textContent='🔄 Reset All Scores';
      resetBtn.addEventListener('click',()=>{ if(confirm('Reset all scores to 0?')){ state.teams.forEach(t=>t.score=0); renderTeams(); debouncedSave(); } });
      sett.appendChild(resetBtn);

      addTransparencyControl(shell, state, debouncedSave);
      addFontSizeControl(shell, state, debouncedSave, null, 28);

      return {
        getState: ()=>({ title:state.title, teams:[...state.teams.map(t=>({...t}))], fontSize:state.fontSize, bgOpacity:state.bgOpacity, hideHeader:state.hideHeader||false }),
        destroy: ()=>{},
        onResize: ()=>{}
      };
    }

    function addWidget(type, x, y, w, h, id, minimized, zi, state){
      const wDef = WIDGET_TYPES.find(t=>t.type===type);
      if(!wDef) return;
      const wid = id || uid();
      if(!id){
        const count = Object.keys(widgets).length;
        x = x || 40 + (count % 5)*30;
        y = y || 40 + (count % 5)*30;
      }
      const shell = createShell(wDef, wid, x||40, y||40, w||wDef.defaultW, h||wDef.defaultH, minimized, zi);
      const wObj = CREATORS[type](shell, state||null);
      wObj.el = shell.el; wObj.type = type;
      widgets[wid] = wObj;
      updateWelcome();
      if(!_importing) debouncedSave();
    }

    // ===== WIDGET PICKER PANEL =====
    const widgetListEl = document.getElementById('widget-list');
    WIDGET_TYPES.forEach(wt=>{
      const item = document.createElement('div');
      item.className = 'widget-picker-item';
      item.innerHTML = `<div style="width:34px;height:34px;background:rgba(99,102,241,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-lucide="${wt.icon}" style="width:16px;height:16px;color:var(--accent);"></i></div><div><div style="font-size:13px;font-weight:600;color:var(--text-primary);">${wt.name}</div><div style="font-size:11px;color:var(--text-muted);">${wt.desc}</div></div>`;
      item.addEventListener('click',()=>{
        addWidget(wt.type);
        closePanel();
      });
      widgetListEl.appendChild(item);

    const panelOverlay = document.getElementById('panel-overlay');

    const bgPanel = document.getElementById('bg-panel');
    const themeDropdown = document.getElementById('theme-dropdown');

    function closePanel(){
      panelOverlay.classList.remove('open');
      widgetPanel.classList.remove('open');
      bgPanel.classList.remove('open');
      themeDropdown.style.display='none';
    }

    document.getElementById('btn-add-widget').addEventListener('click',()=>{
      closePanel();
      panelOverlay.classList.add('open');
      widgetPanel.classList.add('open');
      if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function") lucide.createIcons();
    });
    panelOverlay.addEventListener('click', closePanel);

    // Theme dropdown with sectioned layout
    const THEME_SECTIONS=[{label:'Classic',keys:['dark','light','ocean','forest','sunset','midnight']},{label:'Whimsical ✨',keys:['girly','pastel','unicorn']},{label:'🌸 Pastel Collection',keys:['cherryBlossom','lavenderDusk','pastelSunrise','springBreeze','pastelRainbow','mintGarden','bluebellMeadow','citrusGlow']},{label:'🌌 Gradient & Neon',keys:['neonRainbow','neonCity','auroraBorealis','midnightGalaxy','sunsetVibes','deepOcean','cosmicDust','lavaLamp']},{label:'🟡 Dark & Golden',keys:['goldenHour','darkAmber','midnightGold','blackGold','sundownDark']},{label:'💛 Bright Yellow',keys:['sunshineYellow','lemonZest','darkSunflower','electricYellow','canaryDark']}];
    THEME_SECTIONS.forEach(section=>{
      const hdr=document.createElement('div');
      hdr.style.cssText='font-size:13px;color:var(--text-dim);padding:6px 8px 2px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-top:1px solid var(--border-color);margin-top:2px;';
      hdr.textContent=section.label;

      section.keys.forEach(k=>{

        opt.innerHTML=`<span class="theme-swatch" style="${sw}width:18px;height:18px;border-radius:5px;flex-shrink:0;border:1px solid rgba(0,0,0,0.1);"></span><span>${t.name}</span>`;

    const gradientOpts = document.getElementById('gradient-opts');

    // Snap to grid

    // Sparkles toggle
    const sparkleBtn = document.getElementById('btn-sparkles');
    function updateSparkleBtn(){

        sparkleBtn.classList.add('sparkle-active');
      } else {
        sparkleBtn.classList.remove('sparkle-active');
      }
    }
    sparkleBtn.addEventListener('click',()=>{

    document.getElementById('btn-fullscreen').addEventListener('click',()=>{
      if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
      else { document.exitFullscreen(); }
